[project]
name = "patchwork"
version = "0.1.0"
description = "Road defect register that measures damaged area (m²) with OpenCV 5 and verifies repairs; agentic work orders on AWS."
readme = "docs/README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
  "opencv-contrib-python-headless==5.0.0.93",
  "numpy>=2.0",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "shapely>=2.0",
  "pyproj>=3.6",
  "fsspec>=2024.6",
  "python-ulid>=2.7",
]

[dependency-groups]
dev = [
  "pytest>=8.2",
  "ruff>=0.5",
  "onnx>=1.16",
  "onnxruntime>=1.18",
]
aws = [
  "boto3>=1.35",
  "s3fs>=2024.6",
  "matplotlib>=3.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/patchwork"]

[tool.uv]
default-groups = ["dev", "aws"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
