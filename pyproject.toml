[project]
name = "patchwork"
version = "0.1.0"
description = "Road defect register that measures damaged area (m²) with OpenCV 5 and verifies repairs; agentic work orders on AWS."
readme = "main_docs/README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
  "opencv-contrib-python-headless==5.0.0.93",
  "numpy>=2.0",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "shapely>=2.0",
  "pyproj>=3.6",
  "fsspec>=2024.6",
  "python-ulid>=2.7",
  "networkx>=3.7",
]

[dependency-groups]
dev = [
  "pytest>=8.2",
  "ruff>=0.5",
  "onnx>=1.16",
  "onnxruntime>=1.18",
]
aws = [
  "boto3>=1.35",
  "s3fs>=2024.6",
  "matplotlib>=3.9",
]

train = [
  "torch>=2.5",
  "torchvision>=0.20",
  "transformers>=4.45,<5",
  "onnx>=1.16",
  "onnxruntime>=1.18",
]

agent = [
  "strands-agents>=1.0",
  "boto3>=1.35",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/patchwork"]

[tool.uv]
default-groups = ["dev", "aws"]

# CPU-only torch everywhere (decision D-25): the default PyPI wheels (x86 and aarch64) pull GBs of CUDA libraries
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
